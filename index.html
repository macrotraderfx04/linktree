<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChrisFrp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Archivo+Black&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#07070b;
    --bg-soft:#0e0e16;
    --purple-1:#b06bff;
    --purple-2:#7c3aed;
    --gold-1:#f7d774;
    --gold-2:#d4a017;
    --text:#f2f0f7;
    --muted:#8d8a9c;
    --line: rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{
    height:100%;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow-x:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    min-height:100vh;
    padding:64px 20px 40px;
    position:relative;
  }

  /* ---- signature: ambient candlestick uptrend behind everything ---- */
  #chart-bg{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    opacity:0.55;
  }
  #chart-bg svg{width:100%; height:100%;}

  .vignette{
    position:fixed;
    inset:0;
    z-index:1;
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(124,58,237,0.16), transparent 60%),
      radial-gradient(ellipse 60% 40% at 85% 90%, rgba(212,160,23,0.10), transparent 60%),
      radial-gradient(ellipse 120% 100% at 50% 50%, transparent 40%, var(--bg) 100%);
    pointer-events:none;
  }

  .content{
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    width:100%;
    max-width:480px;
  }

  /* ---- logo ---- */
  .mark{
    width:100%;
    max-width:260px;
    display:flex;
    align-items:center;
    justify-content:center;
    margin-bottom:22px;
    filter: drop-shadow(0 12px 28px rgba(124,58,237,0.35)) drop-shadow(0 4px 14px rgba(212,160,23,0.25));
  }
  .mark img{width:100%; height:auto; display:block;}

  h1{
    font-family:'Archivo Black', sans-serif;
    font-size:30px;
    letter-spacing:0.5px;
    line-height:1;
    text-align:center;
  }
  h1 .frp{
    background:linear-gradient(90deg, var(--purple-1), var(--purple-2) 60%, var(--gold-2) 62%, var(--gold-1));
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .tagline{
    margin-top:4px;
    font-family:'Space Grotesk', sans-serif;
    font-weight:500;
    font-size:14px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--muted);
    text-align:center;
  }

  .tagline .dot{
    color:var(--gold-1);
    margin:0 8px;
  }

  /* ---- links ---- */
  .links{
    width:100%;
    margin-top:40px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  .link-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    padding:18px 20px;
    border-radius:16px;
    background:var(--bg-soft);
    border:1px solid var(--line);
    text-decoration:none;
    color:var(--text);
    overflow:hidden;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .link-card:hover{
    transform:translateY(-3px);
  }
  .link-card:focus-visible{
    outline:2px solid var(--gold-1);
    outline-offset:3px;
  }

  .link-card::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:0;
    transition:opacity 0.25s ease;
    z-index:0;
  }
  .link-card:hover::before{opacity:1;}

  .link-card.free{border-color:rgba(176,107,255,0.35);}
  .link-card.free::before{ background:linear-gradient(120deg, rgba(176,107,255,0.14), transparent 70%); }
  .link-card.free:hover{ box-shadow:0 12px 30px -10px rgba(124,58,237,0.45); }

  .link-card.vip{border-color:rgba(212,160,23,0.4);}
  .link-card.vip::before{ background:linear-gradient(120deg, rgba(247,215,116,0.16), transparent 70%); }
  .link-card.vip:hover{ box-shadow:0 12px 30px -10px rgba(212,160,23,0.5); }

  .icon{
    position:relative;
    z-index:1;
    flex-shrink:0;
    width:40px;
    height:40px;
    border-radius:10px;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .free .icon{ background:linear-gradient(135deg, var(--purple-1), var(--purple-2)); }
  .vip .icon{ background:linear-gradient(135deg, var(--gold-1), var(--gold-2)); }
  .icon svg{width:20px; height:20px;}

  .link-text{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    gap:2px;
  }
  .link-title{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:15.5px;
  }
  .link-sub{
    font-size:12.5px;
    color:var(--muted);
  }

  .badge{
    margin-left:auto;
    position:relative;
    z-index:1;
    font-family:'Space Grotesk', sans-serif;
    font-size:10.5px;
    font-weight:700;
    letter-spacing:0.05em;
    text-transform:uppercase;
    padding:5px 9px;
    border-radius:100px;
    flex-shrink:0;
  }
  .free .badge{ background:rgba(176,107,255,0.15); color:var(--purple-1); }
  .vip .badge{ background:rgba(247,215,116,0.15); color:var(--gold-1); }

  footer{
    position:relative;
    z-index:2;
    margin-top:56px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }

  @media (prefers-reduced-motion: reduce){
    #chart-bg svg .candle-group, #chart-bg svg .trend-line { animation:none !important; }
  }
</style>
</head>

<script>
  // Ambient rising candlestick chart, echoing the FRP mark
  (function(){
    const container = document.getElementById('chart-bg');
    const W = 900, H = 1400;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
    svg.setAttribute("preserveAspectRatio", "xMidYMax slice");

    const defs = document.createElementNS(ns, "defs");
    defs.innerHTML = `
      <linearGradient id="candleGrad" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.35"/>
        <stop offset="100%" stop-color="#f7d774" stop-opacity="0.55"/>
      </linearGradient>
      <linearGradient id="fadeMask" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="white" stop-opacity="0"/>
        <stop offset="35%" stop-color="white" stop-opacity="1"/>
        <stop offset="100%" stop-color="white" stop-opacity="1"/>
      </linearGradient>
      <mask id="edgeMask">
        <rect x="0" y="0" width="${W}" height="${H}" fill="url(#fadeMask)"/>
      </mask>
    `;
    svg.appendChild(defs);

    const g = document.createElementNS(ns, "g");
    g.setAttribute("mask", "url(#edgeMask)");
    svg.appendChild(g);

    const cols = 26;
    const colW = W / cols;
    let y = H * 0.62;
    const pts = [];

    for(let i=0;i<cols;i++){
      const drift = (Math.random() * 90) - 30;
      y = Math.max(H*0.08, y - drift - (i*1.4));
      const bodyH = 18 + Math.random()*46;
      const wickH = bodyH + 20 + Math.random()*30;
      const cx = i*colW + colW/2;
      const up = Math.random() > 0.28;

      const wick = document.createElementNS(ns,"rect");
      wick.setAttribute("class","candle-group");
      wick.setAttribute("x", cx - 1.5);
      wick.setAttribute("y", y - wickH/2);
      wick.setAttribute("width", 3);
      wick.setAttribute("height", wickH);
      wick.setAttribute("fill", "url(#candleGrad)");
      g.appendChild(wick);

      const body = document.createElementNS(ns,"rect");
      body.setAttribute("class","candle-group");
      body.setAttribute("x", cx - 9);
      body.setAttribute("y", y - bodyH/2);
      body.setAttribute("width", 18);
      body.setAttribute("height", bodyH);
      body.setAttribute("rx", 3);
      body.setAttribute("fill", "url(#candleGrad)");
      body.setAttribute("opacity", up ? "0.9" : "0.55");
      g.appendChild(body);

      pts.push([cx, y]);
    }

    const path = document.createElementNS(ns,"path");
    const d = pts.map((p,i)=> (i===0?"M":"L") + p[0] + " " + p[1]).join(" ");
    path.setAttribute("d", d);
    path.setAttribute("class","trend-line");
    path.setAttribute("stroke", "url(#candleGrad)");
    path.setAttribute("stroke-width","2");
    path.setAttribute("fill","none");
    path.setAttribute("opacity","0.5");
    g.appendChild(path);

    container.appendChild(svg);
  })();
</script>
